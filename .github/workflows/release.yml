name: Build SparkEdge Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional override version label
        required: false
        default: ""
      bump:
        description: Semver bump to apply when version is not overridden
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: sparkedge-release-main
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve release version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const inputVersion = `${{ github.event.inputs.version || '' }}`.trim();
            const bumpType = `${{ github.event.inputs.bump || 'patch' }}`.trim() || 'patch';
            const semver = /^v(\d+)\.(\d+)\.(\d+)$/;

            if (inputVersion) {
              core.setOutput('value', inputVersion.startsWith('v') ? inputVersion : `v${inputVersion}`);
              return;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let current = null;
            for (const release of releases) {
              if (semver.test(release.tag_name)) {
                current = release.tag_name;
                break;
              }
            }

            if (!current) {
              core.setOutput('value', 'v0.0.0');
              return;
            }

            const [, major, minor, patch] = current.match(semver);
            let nextMajor = Number.parseInt(major, 10);
            let nextMinor = Number.parseInt(minor, 10);
            let nextPatch = Number.parseInt(patch, 10);

            if (bumpType === 'major') {
              nextMajor += 1;
              nextMinor = 0;
              nextPatch = 0;
            } else if (bumpType === 'minor') {
              nextMinor += 1;
              nextPatch = 0;
            } else {
              nextPatch += 1;
            }

            core.setOutput('value', `v${nextMajor}.${nextMinor}.${nextPatch}`);

  build:
    runs-on: ubuntu-latest
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: windows
            target_arch: amd64
            goarm: ""
            label: windows-amd64
          - target_os: windows
            target_arch: arm64
            goarm: ""
            label: windows-arm64
          - target_os: linux
            target_arch: amd64
            goarm: ""
            label: linux-amd64
          - target_os: linux
            target_arch: arm64
            goarm: ""
            label: linux-arm64
          - target_os: linux
            target_arch: arm
            goarm: "7"
            label: linux-armv7
          - target_os: linux
            target_arch: arm
            goarm: "6"
            label: linux-armv6
          - target_os: darwin
            target_arch: amd64
            goarm: ""
            label: darwin-amd64
          - target_os: darwin
            target_arch: arm64
            goarm: ""
            label: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Build package
        shell: pwsh
        run: >
          ./scripts/build-release.ps1
          -TargetOS "${{ matrix.target_os }}"
          -TargetArch "${{ matrix.target_arch }}"
          -GoArm "${{ matrix.goarm }}"
          -Version "${{ needs.prepare-version.outputs.version }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sparkedge-${{ needs.prepare-version.outputs.version }}-${{ matrix.label }}
          path: dist/packages/sparkedge-${{ needs.prepare-version.outputs.version }}-${{ matrix.label }}.zip
          if-no-files-found: error

  release:
    needs:
      - prepare-version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true

      - name: Generate release manifest and checksums
        shell: pwsh
        run: >
          ./scripts/generate-release-manifest.ps1
          -Version "${{ needs.prepare-version.outputs.version }}"
          -PackagesDir "dist/packages"

      - name: Ensure release tag exists
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = `${{ needs.prepare-version.outputs.version }}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: context.sha,
              });
            }

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/packages/*.zip
            dist/packages/manifest.json
            dist/packages/checksums.txt
